name: Nexora Fullstack - Build and Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    name: API - .NET 10 and xUnit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore API and tests
        run: |
          dotnet restore tests/Nexora.Tests/Nexora.Tests.csproj
          dotnet restore src/Nexora.Api/Nexora.Api.csproj
      - name: Build API
        run: dotnet build src/Nexora.Api/Nexora.Api.csproj -c Release --no-restore
      - name: Run xUnit tests
        run: dotnet test tests/Nexora.Tests/Nexora.Tests.csproj -c Release --no-restore
  frontend:
    name: React - Typecheck, Vitest and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Static TypeScript check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
