services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:?Set SA_PASSWORD in .env}"
    ports:
      - "127.0.0.1:14339:1433"
    volumes:
      - nexora_sql:/var/opt/mssql
  api:
    build:
      context: .
      dockerfile: src/Nexora.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      NEXORA_JWT_KEY: "${NEXORA_JWT_KEY:?Set NEXORA_JWT_KEY in .env}"
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=NexoraOps;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
    ports:
      - "127.0.0.1:5089:8080"
    depends_on:
      - sqlserver
volumes:
  nexora_sql:
